<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <hr>
    <h1>HTML Forms</h1>
    <form>
        <label for = "firstname">First Name:</label>
        <input type = "text" name="firstname" id = "firstname"></input>
        
        <br>
        <br>

        <label for = "lastname">Last Name:</label>
        <input type = "text" name="lastname" id = "lastname"></input>
        
        <br>
        <br>

        <label for = "password">Password:</label>
        <input type = "password" name="password" id = "password"></input>
        
        <br>
        <br>

        <input type="checkbox" id="char1" name="char1"
        value="Amber"></input>
        <label for="char1">Amber</label>

        <br>

        <input type="checkbox" id="char2" name="char2"
        value="Kaeya"></input>
        <label for="char1">Kaeya</label>

        <br>

        <input type="checkbox" id="char3" name="char3"
        value="Lumine"></input>
        <label for="char1">Lumine</label>
        
        <br>
        <br>
        
        <label for="phone">Phone Number: </label>
        <input type = "tel" id = "phone" pattern = "[0-9]{4}-[0-9]{3}-[0-9]{4}"></input>
        <figcaption>Format: xxxx-xxx-xxxx</figcaption>

        <br>
        <br>

        <button type = "submit">Submit</button>
        <button type = "reset">Reset</button>
    </form>
</body>
</html>
